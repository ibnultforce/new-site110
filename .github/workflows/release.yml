name: Tag release

# Raising "version" in twinstack-update.json on the default branch releases it: this tags the
# commit v<version>, and the Twinstack web app offers the newest such tag to existing sites as
# an update. Pushes that don't change the version release nothing.
#
# Sites copied from the template get this file too; the repository check skips it there.
on:
  push:
    paths:
      - twinstack-update.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    if: github.repository == 'DemoProjectDjango/twinstack-site' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag the version if it's new
        run: |
          version=$(node -p "require('./twinstack-update.json').version")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::twinstack-update.json version \"$version\" isn't X.Y.Z"
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists: nothing to release."
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "Released $tag."
