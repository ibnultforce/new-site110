name: Build and deploy

# Publishes every push to the repository's default branch (main or master) to
# GitHub Pages. Pages must use "GitHub Actions" as its source; the Twinstack web
# app turns that on when it duplicates this repo.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per branch: a push to another branch (which deploys nothing) must not cancel
# a deploy of the default branch that's already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install build dependencies
        run: npm ci

      # Where Pages serves this repo: https://<owner>.github.io/<repo> with base
      # path /<repo>, or the custom domain with no base path once one is set.
      # The template itself isn't published: it only builds and checks.
      - id: pages
        if: github.repository != 'DemoProjectDjango/twinstack-site'
        uses: actions/configure-pages@v5

      - name: Build site
        run: node scripts/build.js
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Validate output
        run: node scripts/check.js
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - if: github.repository != 'DemoProjectDjango/twinstack-site'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository != 'DemoProjectDjango/twinstack-site'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
