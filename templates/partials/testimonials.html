{{# if data.testimonials.items }}
<section class="section-y border-t border-line">
  <div class="wrap">
    <div class="mb-12 max-w-[60ch]">
      <h2 class="text-h2">What clients say</h2>
      <p class="mt-3.5 text-lede text-muted">Feedback from long-running engagements, quoted as given.</p>
    </div>
    <div class="grid gap-8 md:grid-cols-3">
      {{# each data.testimonials.items }}
      <blockquote class="border-t-2 border-line-strong pt-5">
        <p class="text-lede leading-snug text-ink">{{ quote }}</p>
        <footer class="mt-3.5 text-[0.9rem] text-muted">
          <cite class="block font-semibold not-italic text-ink-2">{{ industry }}</cite>{{ meta }}
        </footer>
      </blockquote>
      {{/ each }}
    </div>
  </div>
</section>
{{/ if }}
